<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https://api.calorie-tracker.piogino.ch https://world.openfoodfacts.org; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shared Meals — Calorie Tracker</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f4f6fb;
            color: #333;
            min-height: 100vh;
        }

        header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 24px 20px;
            text-align: center;
        }
        header h1 { font-size: 1.6rem; font-weight: 700; }
        header p  { opacity: .85; margin-top: 4px; font-size: 0.95rem; }

        .container {
            max-width: 860px;
            margin: 0 auto;
            padding: 28px 16px 60px;
        }

        .meta {
            text-align: center;
            color: #666;
            margin-bottom: 28px;
            font-size: 0.9rem;
        }

        .day-group {
            margin-bottom: 32px;
        }
        .day-header {
            font-size: 1.1rem;
            font-weight: 700;
            color: #667eea;
            padding: 8px 0 6px;
            border-bottom: 2px solid #e0e4f0;
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .day-header-right {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 2px;
        }
        .day-total {
            font-size: 0.9rem;
            font-weight: 700;
            color: #667eea;
            padding-right: 14px;
        }
        .day-macros {
            display: flex;
            gap: 10px;
            font-size: 0.75rem;
            font-weight: 600;
            color: #667eea;
            opacity: 0.75;
            padding-right: 14px;
        }

        .meal-group {
            background: white;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,.07);
            margin-bottom: 14px;
            overflow: hidden;
        }
        .meal-label {
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            color: #888;
            letter-spacing: .06em;
            padding: 9px 14px 7px;
            border-bottom: 1px solid #f0f2f8;
            display: flex;
            justify-content: space-between;
            align-items: baseline;
        }
        .meal-label-right {
            display: flex;
            align-items: baseline;
            gap: 8px;
        }
        .meal-label-macros {
            color: #bbb;
            font-size: 0.75rem;
            font-weight: 500;
            text-transform: none;
            letter-spacing: 0;
        }
        .meal-label-total {
            color: #667eea;
            font-size: 0.8rem;
            text-transform: none;
            letter-spacing: 0;
        }
        .day-macros {
            display: flex;
            gap: 14px;
            font-size: 0.8rem;
            font-weight: 600;
            color: #667eea;
            padding-bottom: 10px;
            padding-right: 14px;
            justify-content: flex-end;
        }
        .log-row {
            display: flex;
            align-items: baseline;
            gap: 10px;
            padding: 7px 14px;
            border-bottom: 1px solid #f5f5f8;
            font-size: 0.88rem;
        }
        .log-row:last-of-type { border-bottom: none; }
        .log-name { flex: 1; font-weight: 500; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .log-details { color: #aaa; font-size: 0.8rem; white-space: nowrap; flex-shrink: 0; }
        .log-kcal { font-weight: 700; font-size: 0.85rem; color: #aaa; white-space: nowrap; flex-shrink: 0; }
        .share-meal-photos { display: flex; flex-wrap: wrap; gap: 10px; padding: 10px 14px; border-top: 1px solid #f0f2f8; }
        .share-meal-thumb { width: 140px; height: 140px; object-fit: cover; border-radius: 8px; cursor: pointer; border: 1px solid #ddd; transition: transform 0.15s; }
        .share-meal-thumb:hover { transform: scale(1.03); }

        .lightbox {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,.85);
            align-items: center;
            justify-content: center;
            z-index: 9000;
            cursor: pointer;
        }
        .lightbox.open { display: flex; }
        .lightbox img {
            max-width: 92vw;
            max-height: 88vh;
            border-radius: 8px;
            pointer-events: none;
        }

        .loading, .error-msg {
            text-align: center;
            padding: 60px 20px;
            color: #666;
            font-size: 1rem;
        }
        .error-msg { color: #c0392b; }

        footer {
            text-align: center;
            color: #aaa;
            font-size: 0.8rem;
            padding: 20px;
        }
        footer a { color: #667eea; text-decoration: none; }

        .view-controls {
            background: white;
            border-bottom: 1px solid #e0e4f0;
            padding: 10px 16px;
            display: flex;
            justify-content: center;
            gap: 24px;
        }
        .view-controls label {
            display: flex;
            align-items: center;
            gap: 7px;
            font-size: 0.9rem;
            color: #555;
            cursor: pointer;
            user-select: none;
        }
        .view-controls input[type="checkbox"] {
            width: 16px;
            height: 16px;
            cursor: pointer;
            accent-color: #667eea;
        }

        .day-macros span { white-space: nowrap; }
        #content.hide-images .share-meal-photos { display: none; }
        #content.hide-text .log-row { display: none; }

        .shared-day-comment {
            background: rgba(102, 126, 234, 0.08);
            border-left: 3px solid #667eea;
            border-radius: 4px 8px 8px 4px;
            padding: 8px 14px;
            margin-top: 10px;
            font-size: 0.88rem;
            color: #555;
            white-space: pre-wrap;
            word-break: break-word;
        }
    </style>
</head>
<body>
<header>
    <h1>🍽️ Shared Meals</h1>
    <p id="headerMeta">Loading…</p>
</header>

<div class="view-controls">
    <label><input type="checkbox" id="toggleImages" checked> Show Images</label>
    <label><input type="checkbox" id="toggleText" checked> Show Text</label>
</div>

<div class="container" id="content">
    <div class="loading" id="loading">Fetching shared meals…</div>
</div>

<div class="lightbox" id="lightbox">
    <img id="lightboxImg" src="" alt="Meal photo">
</div>

<footer>
    Powered by <a href="/">Calorie Tracker</a> · <a href="/privacy.html">Privacy</a>
</footer>

<script src="/share.js"></script>
</body>
</html>
